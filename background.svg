<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Test engineering background</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.8" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.1" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M240 0H0V240" fill="none" stroke="#5eead4" stroke-opacity="0.12" stroke-width="1.2"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowR)"/>
  <rect width="1920" height="1080" fill="url(#glowL)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#gridBig)"/>

  <!-- Oscilloscope waveforms -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M0,600 C80,500 160,500 240,600 S400,700 480,600 S640,500 720,600 S880,700 960,600 S1120,500 1200,600 S1360,700 1440,600 S1600,500 1680,600 S1840,700 1920,600"
          stroke="url(#wave1)" stroke-width="3"/>
    <path d="M0,610 C60,570 120,570 180,610 S300,650 360,610 S480,570 540,610 S660,650 720,610 S840,570 900,610 S1020,650 1080,610 S1200,570 1260,610 S1380,650 1440,610 S1560,570 1620,610 S1740,650 1800,610 S1920,570 1920,610"
          stroke="url(#wave2)" stroke-width="2" stroke-opacity="0.8"/>
  </g>

  <!-- Digital signal / test pulse train -->
  <path d="M0,860 H140 V820 H300 V860 H420 V820 H460 V860 H640 V820 H780 V860 H900 V820 H1080 V860 H1180 V820 H1220 V860 H1400 V820 H1560 V860 H1680 V820 H1780 V860 H1920"
        fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <path d="M0,930 H220 V890 H380 V930 H560 V890 H600 V930 H820 V890 H980 V930 H1100 V890 H1300 V930 H1500 V890 H1540 V930 H1740 V890 H1860 V930 H1920"
        fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round"/>

  <!-- LabVIEW-style block diagram (top right) -->
  <g transform="translate(1130,110)" fill="none" stroke-linejoin="round">
    <!-- wires -->
    <g stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M150,60 H230 V40 H310" stroke="#fbbf24"/>
      <path d="M150,100 H200 V150 H310" stroke="#22d3ee"/>
      <path d="M470,40 H560 V90 H620" stroke="#fbbf24"/>
      <path d="M470,150 H540 V110 H620" stroke="#22d3ee"/>
      <path d="M780,100 H860 V180 H930" stroke="#3b82f6"/>
      <path d="M150,100 V260 H310" stroke="#3b82f6" stroke-opacity="0.7"/>
      <path d="M470,260 H700 V160" stroke="#3b82f6" stroke-opacity="0.7"/>
    </g>
    <!-- nodes -->
    <g stroke="#22d3ee" stroke-width="2" fill="#0b1f3a" fill-opacity="0.75">
      <rect x="0" y="30" width="150" height="100" rx="10"/>
      <rect x="310" y="10" width="160" height="60" rx="8"/>
      <rect x="310" y="120" width="160" height="60" rx="8"/>
      <rect x="310" y="230" width="160" height="60" rx="8"/>
      <rect x="620" y="60" width="160" height="100" rx="10"/>
      <rect x="930" y="150" width="140" height="60" rx="8"/>
    </g>
    <!-- terminals -->
    <g fill="#fbbf24">
      <circle cx="150" cy="60" r="6"/><circle cx="150" cy="100" r="6"/>
      <circle cx="310" cy="40" r="6"/><circle cx="310" cy="150" r="6"/><circle cx="310" cy="260" r="6"/>
      <circle cx="470" cy="40" r="6"/><circle cx="470" cy="150" r="6"/><circle cx="470" cy="260" r="6"/>
      <circle cx="620" cy="90" r="6"/><circle cx="620" cy="110" r="6"/><circle cx="780" cy="100" r="6"/>
      <circle cx="930" cy="180" r="6"/>
    </g>
    <!-- node icons -->
    <g stroke="#22d3ee" stroke-width="2" stroke-opacity="0.8">
      <path d="M20,100 Q45,50 70,80 T120,70"/>
      <path d="M335,40 h110 M335,150 h110 M335,260 h110" stroke-dasharray="6 8"/>
      <path d="M650,130 l25,-40 l25,30 l30,-50" />
    </g>
    <!-- pass indicator -->
    <g transform="translate(985,180)" stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M-18,0 l12,12 l24,-26"/>
    </g>
  </g>

  <!-- Python-style code lines (top left, subtle) -->
  <g transform="translate(110,130)" opacity="0.5">
    <g fill="#3b82f6">
      <rect x="0" y="0" width="70" height="10" rx="5"/>
      <rect x="0" y="40" width="50" height="10" rx="5"/>
      <rect x="40" y="80" width="60" height="10" rx="5"/>
      <rect x="40" y="160" width="90" height="10" rx="5"/>
      <rect x="0" y="240" width="60" height="10" rx="5"/>
    </g>
    <g fill="#fbbf24">
      <rect x="86" y="0" width="150" height="10" rx="5"/>
      <rect x="66" y="40" width="210" height="10" rx="5"/>
      <rect x="116" y="80" width="120" height="10" rx="5"/>
      <rect x="146" y="160" width="100" height="10" rx="5"/>
    </g>
    <g fill="#22d3ee">
      <rect x="80" y="120" width="120" height="10" rx="5"/>
      <rect x="40" y="120" width="30" height="10" rx="5"/>
      <rect x="116" y="200" width="180" height="10" rx="5"/>
      <rect x="76" y="240" width="130" height="10" rx="5"/>
    </g>
    <g fill="#94a3b8" fill-opacity="0.6">
      <rect x="250" y="0" width="60" height="10" rx="5"/>
      <rect x="220" y="120" width="90" height="10" rx="5"/>
      <rect x="40" y="200" width="60" height="10" rx="5"/>
    </g>
    <!-- line gutter -->
    <g stroke="#64748b" stroke-opacity="0.5" stroke-width="2">
      <path d="M-24,-4 V262"/>
    </g>
  </g>

  <!-- Circuit traces (bottom left) -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round">
    <path d="M0,720 H180 L240,660 H420 L470,710 H640"/>
    <path d="M0,760 H140 L200,820 H360"/>
    <path d="M60,1080 V990 L120,930 V780"/>
    <path d="M300,1080 V1000 H520 L580,940"/>
  </g>
  <g fill="#0b1f3a" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2">
    <circle cx="640" cy="710" r="7"/><circle cx="420" cy="660" r="7"/>
    <circle cx="360" cy="820" r="7"/><circle cx="120" cy="780" r="7"/>
    <circle cx="580" cy="940" r="7"/><circle cx="180" cy="720" r="7"/>
  </g>

  <!-- Test results bars (bottom right) -->
  <g transform="translate(1400,960)">
    <g fill="#34d399" fill-opacity="0.55">
      <rect x="0" y="-40" width="14" height="40" rx="3"/>
      <rect x="26" y="-70" width="14" height="70" rx="3"/>
      <rect x="52" y="-55" width="14" height="55" rx="3"/>
      <rect x="78" y="-90" width="14" height="90" rx="3"/>
      <rect x="104" y="-75" width="14" height="75" rx="3"/>
      <rect x="130" y="-110" width="14" height="110" rx="3"/>
      <rect x="156" y="-95" width="14" height="95" rx="3"/>
    </g>
    <rect x="182" y="-60" width="14" height="60" rx="3" fill="#f87171" fill-opacity="0.6"/>
    <rect x="208" y="-120" width="14" height="120" rx="3" fill="#34d399" fill-opacity="0.55"/>
    <rect x="234" y="-100" width="14" height="100" rx="3" fill="#34d399" fill-opacity="0.55"/>
    <path d="M-10,0 H270" stroke="#64748b" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- Floating measurement markers -->
  <g fill="#22d3ee" fill-opacity="0.5">
    <circle cx="960" cy="600" r="5"/>
    <circle cx="480" cy="600" r="4"/>
    <circle cx="1440" cy="600" r="4"/>
    <circle cx="1200" cy="470" r="3"/>
    <circle cx="720" cy="740" r="3"/>
  </g>
  <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 8">
    <path d="M960,120 V1080"/>
    <path d="M0,600 H1920"/>
  </g>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
